[tox]
envlist = py,ruff
minversion = 4.0
skipsdist = false

[testenv]
runner = uv-venv-lock-runner
extras = test
commands = pytest {posargs} exordos_opencode_server/tests/unit tests

[testenv:ruff]
runner = uv-venv-lock-runner
extras = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:develop]
runner = uv-venv-lock-runner
extras = test,ruff
