build:
  deps:
    - dst: /opt/exordos_opencode_server
      path:
        src: ../../exordos_opencode_server
      exclude:
        - .git
        - .mypy_cache
        - .pytest_cache
        - .ruff_cache
        - .tox
        - .venv
        - __pycache__
        - "*/__pycache__"
        - "*.egg-info"
        - "*.pyc"
        - build
        - dist
        - output

  elements:
    - manifest: manifests/opencode_server.yaml.j2
      artifacts:
        # The MetaPaaS plugin wheel, installed into metapaas at runtime.
        - script: images/build_wheel.sh
          name: pypi_package
          artifacts:
            - ../dist/*.whl
      images:
        # The disposable build worker launched by the pool.
        - name: opencode_worker
          format: zst
          profile: exordos_base
          profile_version: "1.3.7"
          script: images/worker_install.sh
          override:
            disk_size: "8G"
