[project]
name = "exordos-opencode-server"
description = "Exordos element for an authenticated OpenCode Server"
readme = "README.md"
authors = [{name = "Genesis Corporation", email = "cassi@exordos.com"}]
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
homepage = "https://github.com/exordos/exordos_opencode_server/"

[project.optional-dependencies]
test = [
    "Jinja2>=3.1.0,<4.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "pytest>=9.0.0,<10.0.0",
]
ruff = [
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
